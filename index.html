<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Comprehension & Fluency Simulator</title>
    <style>
        :root { --bg-color: #f8fafc; --sidebar-bg: #ffffff; --primary: #4f46e5; --primary-hover: #4338ca; --text-dark: #0f172a; --text-muted: #475569; --border: #e2e8f0; --bubble-incoming: #f1f5f9; --bubble-outgoing: #4f46e5; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .preview-panel { width: 100%; max-width: 450px; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .phone-wrapper { width: 100%; max-width: 380px; height: 760px; background: #111; border-radius: 40px; padding: 10px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; }
        .phone-screen { background-color: #ffffff; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .chat-header { background-color: #ffffff; border-bottom: 1px solid var(--border); padding: 14px; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background-color: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .header-info h2 { font-size: 14px; color: var(--text-dark); }
        .header-info p { font-size: 11px; color: var(--success); }
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
        .screen.active { display: flex; }
        #menu-screen { padding: 50px 20px 30px 20px; justify-content: flex-start; text-align: center; overflow-y: auto; }
        .menu-btn { width: 100%; background: white; border: 2px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; text-align: left; cursor: pointer; }
        .chat-history { flex-grow: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease forwards; }
        .msg-wrapper.incoming { align-self: flex-start; }
        .msg-wrapper.outgoing { align-self: flex-end; }
        .msg { padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .msg-wrapper.incoming .msg { background-color: var(--bubble-incoming); color: var(--primary); border-top-left-radius: 4px; cursor: pointer; font-weight: 500; border: 1px solid rgba(79, 70, 229, 0.15); }
        .msg-wrapper.outgoing .msg { background-color: var(--bubble-outgoing); color: white; border-top-right-radius: 4px; }
        .msg-audio-player { margin-top: 6px; width: 100%; max-width: 200px; height: 25px; border-radius: 4px; }
        .action-panel { background: white; border-top: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
        .choice-btn { background: #f9fafb; border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; font-size: 12px; }
        .btn { padding: 8px 14px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); }
        .primer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; justify-content: center; align-items: center; padding: 16px; }
        .primer-overlay.active { display: flex; }
        .primer-modal { background: white; border-radius: 20px; padding: 20px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .recorder-modal { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .script-quote-box { background: #f8fafc; border-left: 4px solid var(--primary); padding: 12px; font-style: italic; font-size: 13px; text-align: left; margin: 14px 0; color: var(--text-dark); max-height: 120px; overflow-y: auto; }
        .recording-pulse-indicator { width: 14px; height: 14px; background-color: var(--danger); border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse-glow 1s infinite alternate; vertical-align: middle; }
        .outcome-card { padding: 14px; border-radius: 12px; text-align: center; margin-top: 10px; }
        .outcome-card.win { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .outcome-card.fail { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        .outcome-card.excuse { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-glow { from { opacity: 0.4; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }
    </style>
</head>
<body>
<div class="preview-panel">
    <div class="phone-wrapper">
        <div class="phone-screen">
            <div id="primer-overlay" class="primer-overlay">
                <div class="primer-modal">
                    <h3 style="margin-bottom: 12px;">📋 Project Briefing</h3>
                    <p style="font-size: 11px; font-weight: bold; color: var(--primary);">ASSIGNMENT ROLE</p>
                    <p id="p-role" style="font-size: 13px; margin-bottom: 10px; color: var(--text-muted);"></p>
                    <p style="font-size: 11px; font-weight: bold; color: var(--primary);">CONTEXT SCENARIO</p>
                    <p id="p-situation" style="font-size: 13px; margin-bottom: 14px; color: var(--text-muted);"></p>
                    <button class="btn" style="width: 100%;" onclick="launchLiveSimulationCall()">Initiate Connection</button>
                </div>
            </div>
            <div id="recorder-overlay" class="primer-overlay">
                <div class="recorder-modal">
                    <h4 style="font-size: 14px;">🎙️ Verbal Production Check</h4>
                    <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Read the option line out loud to proceed:</p>
                    <div class="script-quote-box" id="recorder-script-text"></div>
                    <div style="margin-bottom: 16px; height: 20px;" id="recorder-status-msg"><span style="font-size: 12px; color: var(--text-muted);">Ready to record</span></div>
                    <div style="display: flex; gap: 10px; justify-content: center;">
                        <button class="btn" id="btn-start-record" onclick="startUserVoiceCapture()">🔴 Record</button>
                        <button class="btn btn-danger" id="btn-stop-record" onclick="stopUserVoiceCapture()" disabled>⏹️ Stop</button>
                        <button class="btn btn-secondary" id="btn-cancel-record" onclick="closeVoiceRecorderModal()">Cancel</button>
                    </div>
                </div>
            </div>
            <div id="menu-screen" class="screen active">
                <h2 style="font-size: 18px; margin-bottom: 4px;">Simulation Portal</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Choose a module to start</p>
                <div id="menu-options-container"></div>
            </div>
            <div id="chat-screen" class="screen">
                <div class="chat-header">
                    <div class="avatar" id="sim-avatar">??</div>
                    <div class="header-info">
                        <h2 id="sim-name">Character</h2>
                        <p>● Connected Status</p>
                    </div>
                    <button class="btn btn-secondary" style="margin-left: auto; padding: 4px 8px; font-size: 11px;" onclick="abortSimulationCall()">Quit</button>
                </div>
                <div class="chat-history" id="sim-chat-history"></div>
                <div class="action-panel" id="sim-options-panel"></div>
            </div>
        </div>
    </div>
</div>

};
function abortSimulationCall() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        globalAudioPlayerElement.pause();
        document.getElementById('chat-screen').classList.remove('active');
        document.getElementById('menu-screen').classList.add('active');
        closeVoiceRecorderModal();
    }
function advanceDialogueSimulationTree(playerChoiceText, nextNodeKey, userRecordedAudioUrl = null) {
        const history = document.getElementById('sim-chat-history');
        
        const msgWrap = document.createElement('div');
        msgWrap.className = 'msg-wrapper outgoing';
        
        // Renders choice text + a native browser inline player containing their voice clip!
        let audioMarkup = userRecordedAudioUrl ? 
            `<br><audio controls src="${userRecordedAudioUrl}" class="msg-audio-player"></audio>` : '';
            
        msgWrap.innerHTML = `<div class="msg">${playerChoiceText}${audioMarkup}</div>`;
        history.appendChild(msgWrap);
        history.scrollTop = history.scrollHeight;

        activeSimNodeKey = nextNodeKey;
        
        document.getElementById('sim-options-panel').innerHTML = '<span style="font-size:12px; color:#aaa; padding:10px;">Typing...</span>';
        setTimeout(() => {
            renderSimulationStepNode();
        }, 800);
    }
function renderSimulationStepNode() {
        const trackData = scenarios[activeSimTrackKey];
        const nodeData = trackData.nodes[activeSimNodeKey];
        const history = document.getElementById('sim-chat-history');
        const optionsPanel = document.getElementById('sim-options-panel');

        optionsPanel.innerHTML = '';

        const msgWrap = document.createElement('div');
        msgWrap.className = 'msg-wrapper incoming';
        msgWrap.innerHTML = `
            <div class="msg" onclick="replayActiveAudioNode('${activeSimTrackKey}', '${activeSimNodeKey}')">
                <span>🔊 [Listen to Message]</span>
            </div>
        `;
        history.appendChild(msgWrap);
        history.scrollTop = history.scrollHeight;

        handleDialogueAudioPlayback(nodeData, trackData.gender);

        if (nodeData.is_end) {
            const outcomeCard = document.createElement('div');
            outcomeCard.className = `outcome-card ${nodeData.end_type}`;
            outcomeCard.innerHTML = `
                <strong style="font-size:14px;">${nodeData.end_label || 'Simulation Ended'}</strong>
                <p style="font-size:12px; margin-top:4px;">${nodeData.summary || ''}</p>
                <button class="btn btn-secondary" style="margin-top:10px; width:100%; padding:6px;" onclick="abortSimulationCall()">Return to Portal</button>
            `;
            optionsPanel.appendChild(outcomeCard);
        } else {
            nodeData.choices.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = ch.text;
                // INTERCEPTS BUTTON HIT TO REQUIRE AUDIO CAPTURE OVRERLAY FIRST
                btn.onclick = () => openVoiceRecorderModal(ch.text, ch.next);
                optionsPanel.appendChild(btn);
            });
        }
    }
function launchLiveSimulationCall() {
        document.getElementById('primer-overlay').classList.remove('active');
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('chat-screen').classList.add('active');

        const trackData = scenarios[activeSimTrackKey];
        document.getElementById('sim-name').innerText = trackData.partner;
        document.getElementById('sim-avatar').innerText = trackData.initials || "??";
        document.getElementById('sim-chat-history').innerHTML = '';

        activeSimNodeKey = trackData.start_node;
        renderSimulationStepNode();
    }
function selectTrackAndTriggerBriefingOverlay(trackKey) {
        saveActiveNodeChanges();
        activeSimTrackKey = trackKey;
        const trackData = scenarios[trackKey];

        document.getElementById('p-role').innerText = trackData.primer.role;
        document.getElementById('p-situation').innerText = trackData.primer.situation;
        document.getElementById('primer-overlay').classList.add('active');
    }
function rebuildSimMenuUi() {
        const container = document.getElementById('menu-options-container');
        if (!container) return;
        container.innerHTML = '';

        Object.keys(scenarios).forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerHTML = `<strong>${scenarios[key].label}</strong><br><small style="color:var(--text-muted);">Opponent: ${scenarios[key].partner}</small>`;
            btn.onclick = () => selectTrackAndTriggerBriefingOverlay(key);
            container.appendChild(btn);
        });
    }
function executeTextToSpeechSynthesis(scriptContentText, targetGenderProfile) {
        if (!('speechSynthesis' in window)) return;
        const utteranceInstance = new SpeechSynthesisUtterance(scriptContentText);
        const engineSystemVoicesList = window.speechSynthesis.getVoices();
        
        if (engineSystemVoicesList.length > 0) {
            const normalizedGenderKey = targetGenderProfile.toLowerCase();
            if (normalizedGenderKey === 'female') {
                utteranceInstance.voice = engineSystemVoicesList.find(voice => 
                    voice.name.toLowerCase().includes('female') || voice.name.toLowerCase().includes('zira') || voice.name.toLowerCase().includes('google us english')
                ) || engineSystemVoicesList[0];
            } else {
                utteranceInstance.voice = engineSystemVoicesList.find(voice => 
                    voice.name.toLowerCase().includes('male') || voice.name.toLowerCase().includes('david') || voice.name.toLowerCase().includes('mark')
                ) || engineSystemVoicesList[0];
            }
        }
        window.speechSynthesis.speak(utteranceInstance);
    }
function handleDialogueAudioPlayback(nodeObject, fallbackGenderStr) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        globalAudioPlayerElement.pause();
        globalAudioPlayerElement.currentTime = 0;

        if (nodeObject.audio_url && nodeObject.audio_url.trim() !== "") {
            globalAudioPlayerElement.src = nodeObject.audio_url.trim();
            globalAudioPlayerElement.play().catch(err => {
                console.warn("Custom track source failed. Cascading to TTS fallback.", err);
                executeTextToSpeechSynthesis(nodeObject.text, fallbackGenderStr);
            });
        } else {
            executeTextToSpeechSynthesis(nodeObject.text, fallbackGenderStr);
        }
    }
function replayActiveAudioNode(trackKey, nodeKey) {
        const trackData = scenarios[trackKey];
        const nodeData = trackData.nodes[nodeKey];
        if (nodeData) {
            handleDialogueAudioPlayback(nodeData, trackData.gender);
        }
    }
function openVoiceRecorderModal(choiceText, nextNodeKey) {
        pendingTargetChoiceText = choiceText;
        pendingTargetNextNodeKey = nextNodeKey;

        document.getElementById('recorder-script-text').innerText = `"${choiceText}"`;
        document.getElementById('recorder-status-msg').innerHTML = `<span style="color:var(--text-muted);">Ready to record</span>`;
        
        document.getElementById('btn-start-record').disabled = false;
        document.getElementById('btn-stop-record').disabled = true;

        document.getElementById('recorder-overlay').classList.add('active');
    }
function closeVoiceRecorderModal() {
        if (mediaRecorderInstance && mediaRecorderInstance.state !== "inactive") {
            mediaRecorderInstance.stop();
        }
        document.getElementById('recorder-overlay').classList.remove('active');
        audioDataChunks = [];
    }
async function startUserVoiceCapture() {
        audioDataChunks = [];
        try {
            const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorderInstance = new MediaRecorder(audioStream);
            
            mediaRecorderInstance.ondataavailable = function(event) {
                if (event.data.size > 0) audioDataChunks.push(event.data);
            };

            mediaRecorderInstance.onstop = function() {
                const audioBlobData = new Blob(audioDataChunks, { type: 'audio/webm' });
                const audioPlaybackUrl = URL.createObjectURL(audioBlobData);
                
                // Commit complete sequence forward
                document.getElementById('recorder-overlay').classList.remove('active');
                advanceDialogueSimulationTree(pendingTargetChoiceText, pendingTargetNextNodeKey, audioPlaybackUrl);
            };

            mediaRecorderInstance.start();
            
            document.getElementById('btn-start-record').disabled = true;
            document.getElementById('btn-stop-record').disabled = false;
            document.getElementById('recorder-status-msg').innerHTML = `
                <span style="color:var(--danger); font-weight:bold;">
                    <span class="recording-pulse-indicator"></span> Recording Live Audio...
                </span>`;
        } catch (err) {
            alert("Microphone configuration access denied or unsupported. Please check system context security scopes.");
            console.error(err);
        }
    }
function stopUserVoiceCapture() {
        if (mediaRecorderInstance && mediaRecorderInstance.state !== "inactive") {
            mediaRecorderInstance.stop();
            // This triggers the mediaRecorderInstance.onstop event handler
        }
    }
let activeSimTrackKey = null;
let activeSimNodeKey = null;
let globalAudioPlayerElement = new Audio();
let mediaRecorderInstance = null;
let audioDataChunks = [];
let pendingTargetChoiceText = '';
let pendingTargetNextNodeKey = '';
function saveActiveNodeChanges() {} 
window.onload = function() { rebuildSimMenuUi(); };
</script>
</body>
